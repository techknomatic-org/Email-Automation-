name: Tests & Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    name: Backend Tests (FastAPI / Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Modules & API Routes
        run: |
          python -c "import backend.app.main; print('Backend modules verified successfully!')"

      - name: Run test suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_campaign_sequence_timer.py tests/test_sequence_api.py -v

  frontend-build:
    name: Frontend Build (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & build
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm run build
